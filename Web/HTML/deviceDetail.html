<!DOCTYPE html>
<html lang="en">
<head>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;700&display=swap" rel="stylesheet">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet" href="CSS/deviceDetail.css">  
    <script src="/JS/menu.js"></script> 
    <script src="/JS/script.js"></script> 
</head>
<body>
    <div class="header-container">
        <img src="/ico/mainOrange.png" alt="Orange Icon" class="header-icon">
        <div class="orange-bar"></div>
        <span class="title">Solar MD 001</span>
    </div>

    <div class="info-row">
        <span class="date-label">Date: 22/09/2026</span>
        <span class="status-connecting">Connecting</span>
    </div>
    <div class="video-card">
        <div class="spinner"></div>
        <span class="video-text">Connecting</span>
    </div>
    
    <div class="cam-header">
        <div class="cam-title-area">
            <span class="cam-icon">📷</span>
            <span class="cam-name">Front Cam</span>
        </div>
        <span class="switch-cam">Switch Cam</span>
    </div>
    
    <div class="orange-progress-bar"></div>
    
    <div class="details-section">
        <div class="section-title">Detail</div>
        <div class="detail-item">Work Date: 22/09/2026</div>
        <div class="detail-item">Estimate Cleaning: 07 Hs. 30 Min 24 Sec.</div>
        <div class="detail-item">Worked Time: 02 Hs. 15 Min 02 Sec.</div>
        <div class="detail-item">Status: Paused</div>
    </div>

    <button id="menuButton" class="menu-fab">
        Menu
    </button>
    
</body>
</html>
